name: Windows Clean Room Test

on:
  push:
    branches: [ "Windows-App"]
  pull_request:
    branches: [ "Windows-App"]

jobs:
  test-bundled-app-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        lfs: true

    - name: Unzip the Application
      shell: pwsh
      run: |
        # Expand the zipped --onedir build 
        Expand-Archive -Path NBME_Console.zip -DestinationPath .\app_testing
        
    - name: Run Tesseract Integration Test
      shell: pwsh
      run: |
        $ExecutablePath = ".\app_testing\NBME_Console\NBME_Console.exe"
        $TestPdfPath = "TestPDF.pdf" 
        
        # 1. VERIFY PATH: If the .exe isn't here, print out the actual folder structure so we can fix the path.
        if (-Not (Test-Path $ExecutablePath)) {
            Write-Error "Could not find executable at $ExecutablePath."
            Write-Host "Here is what was actually unzipped:"
            Get-ChildItem -Path .\app_testing -Recurse | Select-Object FullName
            exit 1
        }
        
        # 2. EXECUTE AND WAIT: Start-Process forces the runner to wait for the GUI app to finish its --test routine.
        Write-Host "Launching executable..."
        $process = Start-Process -FilePath $ExecutablePath -ArgumentList $TestPdfPath, "--test" -Wait -PassThru
        
        # 3. CAPTURE EXIT CODE:
        $exitCode = $process.ExitCode
        Write-Host "Process exited with code: $exitCode"
        
        if ($exitCode -ne 0) {
            Write-Error "Integration test failed or crashed with exit code $exitCode"
            exit $exitCode
        }
        
        Write-Host "Integration test completed successfully!"